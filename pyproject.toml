[project]
name = "netmedic"
version = "0.1.0"
description = "Autonomous AI agent that detects, diagnoses and remediates network incidents — safely."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "asyncssh>=2.17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.8",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=43",
    "segno>=1.6",
]

[project.scripts]
netmedic = "netmedic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netmedic"]
